# ==============================================================================
# PACT Infrastructure as Code — Render Blueprint
# ==============================================================================
# Declares:
# 1. pact-postgres: Managed PostgreSQL 16 database.
# 2. pact-api: Production FastAPI Web Service with Alembic migrations.
# 3. pact-web: Production Next.js Static Site with client-side SPA routing.
# 4. pact-worker: Transactional outbox publisher & background event worker.
# 5. pact-cycle-tick: Automated cron job for shopping cycle evaluation.
# ==============================================================================

version: "1"

databases:
  - name: pact-postgres
    databaseName: pact_prod
    user: pactuser
    plan: starter
    region: oregon
    postgresMajorVersion: "16"

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: pact-api
    env: python
    region: oregon
    plan: starter
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: ./scripts/entrypoint.sh
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PROJECT_NAME
        value: "PACT API"
      - key: API_PREFIX
        value: "/api/v1"
      - key: DATABASE_URL
        fromDatabase:
          name: pact-postgres
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: SESSION_COOKIE_NAME
        value: pact_session
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: "none"
      - key: FRONTEND_URL
        fromService:
          type: web
          name: pact-web
          property: host
      - key: EXTRA_ORIGINS
        value: "capacitor://localhost,http://localhost,https://localhost"
      - key: BUSINESS_TZ
        value: Asia/Kolkata
      - key: CYCLE_CUTOFF_DAY
        value: "22"
      - key: CYCLE_CUTOFF_HOUR
        value: "17"
      - key: CYCLE_CUTOFF_MINUTE
        value: "27"
      - key: EVENT_TRANSPORT
        value: inline
      - key: SEARCH_BACKEND
        value: postgres
      - key: PAYMENT_GATEWAY
        value: mock
      - key: RUN_MIGRATIONS
        value: "true"
      - key: SEED_ON_STARTUP
        value: "false"

  # ----------------------------------------------------------------------------
  # 2. Next.js Static Site (Client-Side Export)
  # ----------------------------------------------------------------------------
  - type: web
    name: pact-web
    env: static
    region: oregon
    plan: starter
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: pact-api
          property: host

  # ----------------------------------------------------------------------------
  # 3. Background Outbox & Event Worker
  # ----------------------------------------------------------------------------
  - type: worker
    name: pact-worker
    env: python
    region: oregon
    plan: starter
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.workers.outbox_publisher
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pact-postgres
          property: connectionString
      - key: EVENT_TRANSPORT
        value: inline

  # ----------------------------------------------------------------------------
  # 4. Shopping Cycle Evaluation Cron
  # ----------------------------------------------------------------------------
  - type: cron
    name: pact-cycle-tick
    env: python
    region: oregon
    schedule: "*/5 * * * *"
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.workers.cycle_evaluator
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pact-postgres
          property: connectionString
      - key: BUSINESS_TZ
        value: Asia/Kolkata
