databases:
  - name: pact-postgres
    databaseName: pact_prod
    user: pactuser
    plan: starter
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: pact-api
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci && npm --workspace=@pact/shared run build && npm --workspace=@pact/api run build
    startCommand: npm --workspace=@pact/api run db:migrate && npm --workspace=@pact/api run start
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: pact-postgres
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: "none"
      - key: OTP_MODE
        value: production
      - key: FRONTEND_URL
        fromService:
          type: web
          name: pact-web
          property: host
      - key: BUSINESS_TZ
        value: Asia/Kolkata
      - key: CYCLE_CUTOFF_DAY
        value: "22"
      - key: CYCLE_CUTOFF_HOUR
        value: "17"
      - key: CYCLE_CUTOFF_MINUTE
        value: "27"
      - key: PAYMENT_GATEWAY
        value: mock

  - type: worker
    name: pact-worker
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci && npm --workspace=@pact/shared run build && npm --workspace=@pact/api run build
    startCommand: npm --workspace=@pact/api run worker:start
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pact-postgres
          property: connectionString
      - key: BUSINESS_TZ
        value: Asia/Kolkata

  - type: web
    name: pact-web
    env: static
    region: oregon
    buildCommand: npm ci && npm --workspace=@pact/shared run build && npm --workspace=@pact/web run build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: pact-api
          property: host
