name: pact

services:
  postgres:
    image: postgres:16-alpine
    container_name: pact-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pactuser
      POSTGRES_PASSWORD: pactpassword
      POSTGRES_DB: pact_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pactuser -d pact_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
