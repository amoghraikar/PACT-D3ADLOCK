# Render Blueprint for PACT Infrastructure
services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: pact-api
    env: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://pact-web.onrender.com
      - key: EXTRA_ORIGINS
        value: "https://*.onrender.com,https://*.vercel.app"
      - key: LOG_LEVEL
        value: INFO

  # 2. Next.js Frontend Static Site
  - type: static
    name: pact-web
    rootDir: apps/web
    buildCommand: npm install && npm run build
    publishDir: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://pact-api.onrender.com
